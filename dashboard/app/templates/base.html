<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SBK{% endblock %}</title>

    <!-- Tailwind + DaisyUI (static build) -->
    <link href="/static/dist/tailwind.min.css" rel="stylesheet">

    <!-- HTMX (self-hosted) -->
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/htmx-sse.js"></script>

    <!-- CSRF: inject header into all JS fetch() calls -->
    <script>
    (function(){
        var _f=window.fetch;
        window.fetch=function(u,o){
            o=o||{};
            if(o.method&&/^(POST|PUT|DELETE|PATCH)$/i.test(o.method)){
                o.headers=new Headers(o.headers||{});
                o.headers.set('X-SBK-CSRF','1');
            }
            return _f.call(this,u,o);
        };
    })();
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/app.css?v=4">

    <style>
        /* Sidebar transition */
        #sidebar {
            transition: width 0.2s ease;
            will-change: width;
        }
        #sidebar .nav-label {
            transition: opacity 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
        }
        #sidebar.collapsed .nav-label,
        #sidebar.collapsed .nav-divider-text,
        #sidebar.collapsed .brand-text,
        #sidebar.collapsed .sidebar-footer {
            opacity: 0;
            width: 0;
            overflow: hidden;
            pointer-events: none;
        }
        #sidebar.collapsed .nav-divider {
            margin-left: 0.25rem;
            margin-right: 0.25rem;
        }
        /* Tooltip for collapsed icons */
        #sidebar.collapsed .nav-item {
            position: relative;
        }
        #sidebar.collapsed .nav-item:hover .nav-tooltip {
            display: block;
        }
        .nav-tooltip {
            display: none;
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-left: 0.5rem;
            background: oklch(var(--n));
            color: oklch(var(--nc));
            padding: 0.25rem 0.625rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        /* Mobile overlay */
        #sidebar-overlay {
            transition: opacity 0.2s ease;
        }
        /* Collapse button at bottom */
        #sidebar .collapse-btn svg {
            transition: transform 0.2s ease;
        }
        #sidebar.collapsed .collapse-btn svg {
            transform: rotate(180deg);
        }
        /* Keep menu items centered when collapsed */
        #sidebar.collapsed .menu a {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-base-200" hx-headers='{"X-SBK-CSRF":"1"}'>

    <div class="flex h-screen overflow-hidden">
        <!-- Mobile overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 lg:hidden hidden" onclick="closeMobile()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:relative z-40 h-full bg-base-100 flex flex-col w-64 -translate-x-full lg:translate-x-0 transition-transform duration-200">
            <!-- Brand -->
            <div class="flex items-center h-14 px-4 shrink-0">
                <span class="text-primary text-xl font-bold">S</span>
                <span class="brand-text text-xl font-bold">BK</span>
                <span class="brand-text text-xs text-base-content/50 ml-1">v0.1</span>
                <!-- Mobile close -->
                <button class="btn btn-ghost btn-square btn-sm ml-auto lg:hidden" onclick="closeMobile()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-2">
                <ul class="menu menu-md gap-0.5">
                    <li class="nav-item">
                        <a href="/graph" class="{% if page == 'graph' %}active{% endif %}" title="Network">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                            </svg>
                            <span class="nav-label">Network</span>
                            <span class="nav-tooltip">Network</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/timeline" class="{% if page == 'timeline' %}active{% endif %}" title="Timeline">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span class="nav-label">Timeline</span>
                            <span class="nav-tooltip">Timeline</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/relationships" class="{% if page == 'relationships' or page == 'decay' %}active{% endif %}" title="Relationships">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                            <span class="nav-label">Relationships</span>
                            <span class="nav-tooltip">Relationships</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/flow" class="{% if page == 'flow' %}active{% endif %}" title="Flow">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                            </svg>
                            <span class="nav-label">Flow</span>
                            <span class="nav-tooltip">Flow</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/performance" class="{% if page == 'performance' %}active{% endif %}" title="Performance">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                            <span class="nav-label">Performance</span>
                            <span class="nav-tooltip">Performance</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/health-overview" class="{% if page == 'health' %}active{% endif %}" title="Health">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                            <span class="nav-label">Health</span>
                            <span class="nav-tooltip">Health</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/pipeline" class="{% if page == 'pipeline' %}active{% endif %}" title="Pipeline">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            <span class="nav-label">Pipeline</span>
                            <span class="nav-tooltip">Pipeline</span>
                        </a>
                    </li>
                    <li class="my-1"><hr class="border-base-300"/></li>
                    <li class="nav-item">
                        <a href="/settings" class="{% if page == 'settings' %}active{% endif %}" title="Settings">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <span class="nav-label">Settings</span>
                            <span class="nav-tooltip">Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Collapse toggle (bottom) -->
            <div class="shrink-0 border-t border-base-300 p-2 hidden lg:block">
                <button class="collapse-btn btn btn-ghost btn-sm w-full flex items-center gap-2" onclick="toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                    </svg>
                    <span class="nav-label text-xs">Collapse</span>
                </button>
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top bar (mobile only) -->
            <div class="navbar bg-base-100 h-14 shrink-0 lg:hidden border-b border-base-300">
                <button class="btn btn-ghost btn-square btn-sm" onclick="openMobile()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <span class="text-lg font-bold ml-2">
                    <span class="text-primary">S</span>BK
                </span>
            </div>

            <!-- Top utility bar (notification bell + global health banner) -->
            <div class="flex items-center bg-base-100 border-b border-base-300 shrink-0 min-h-[2.5rem]">
                <!-- Global health banner (auto-refresh 60s) -->
                <div id="global-health-banner" class="flex-1"
                     hx-get="/partials/global_health_banner"
                     hx-trigger="load, every 60s"
                     hx-swap="innerHTML">
                </div>

                <!-- Notification bell -->
                <div class="dropdown dropdown-end pr-3">
                    <label tabindex="0" class="btn btn-ghost btn-sm btn-square relative"
                           hx-get="/api/notifications/panel"
                           hx-target="#notif-dropdown"
                           hx-trigger="click"
                           hx-swap="innerHTML">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                        </svg>
                        <span id="notif-badge" class="badge badge-error badge-xs absolute -top-1 -right-1 text-[10px] min-w-[16px] h-4" style="display:none"></span>
                    </label>
                    <div id="notif-dropdown" tabindex="0" class="dropdown-content bg-base-100 rounded-box shadow-xl w-80 mt-2 z-50 border border-base-300">
                        <div class="px-4 py-4 text-center text-sm text-base-content/50">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Page content -->
            <main class="flex-1 overflow-y-auto {% block main_class %}p-6{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
        const collapsed = sidebar.classList.toggle('collapsed');
        if (collapsed) {
            sidebar.style.width = '4rem';
        } else {
            sidebar.style.width = '16rem';
        }
        localStorage.setItem('sbk-sidebar', collapsed ? 'collapsed' : 'open');
    }

    function openMobile() {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    }

    function closeMobile() {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }

    // Restore state on load
    (function() {
        if (localStorage.getItem('sbk-sidebar') === 'collapsed') {
            sidebar.classList.add('collapsed');
            sidebar.style.width = '4rem';
        }
    })();

    // Notification badge count from API
    function updateBadgeFromApi(event) {
        try {
            var data = JSON.parse(event.detail.xhr.responseText);
            var total = data.count || 0;
            // Subtract dismissed
            var dismissed = JSON.parse(localStorage.getItem('sbk-notif-dismissed') || '[]');
            var active = (data.notifications || []).filter(function(n) {
                return dismissed.indexOf(n.id) === -1;
            }).length;
            var badge = document.getElementById('notif-badge');
            if (badge) {
                if (active > 0) {
                    badge.textContent = active > 99 ? '99+' : active;
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            }
        } catch(e) {}
    }

    // Initial badge load
    (function() {
        fetch('/api/notifications')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dismissed = JSON.parse(localStorage.getItem('sbk-notif-dismissed') || '[]');
                var active = (data.notifications || []).filter(function(n) {
                    return dismissed.indexOf(n.id) === -1;
                }).length;
                var badge = document.getElementById('notif-badge');
                if (badge) {
                    if (active > 0) {
                        badge.textContent = active > 99 ? '99+' : active;
                        badge.style.display = '';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            })
            .catch(function() {});
    })();

    // Clean up old dismissed notifications daily
    (function() {
        var lastClean = localStorage.getItem('sbk-notif-clean-date');
        var today = new Date().toISOString().slice(0, 10);
        if (lastClean !== today) {
            localStorage.setItem('sbk-notif-dismissed', '[]');
            localStorage.setItem('sbk-notif-clean-date', today);
        }
    })();

    // Refresh badge count every 2 minutes
    function refreshNotifBadge() {
        fetch('/api/notifications')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var dismissed = JSON.parse(localStorage.getItem('sbk-notif-dismissed') || '[]');
                var active = (data.notifications || []).filter(function(n) {
                    return dismissed.indexOf(n.id) === -1;
                }).length;
                var badge = document.getElementById('notif-badge');
                if (badge) {
                    if (active > 0) {
                        badge.textContent = active > 99 ? '99+' : active;
                        badge.style.display = '';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            })
            .catch(function() {});
    }
    setInterval(refreshNotifBadge, 120000);

    // Global toast notification
    function showToast(message, type) {
        type = type || 'info';
        const container = document.getElementById('toast-container');
        if (!container) return;
        const alertClass = type === 'success' ? 'alert-success' : type === 'error' ? 'alert-error' : 'alert-info';
        const toast = document.createElement('div');
        toast.className = 'alert ' + alertClass + ' shadow-lg text-sm py-2 px-4 animate-fade-in';
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s ease';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3000);
    }

    </script>

    <!-- Pause HTMX polling when tab is hidden (RF-10) -->
    <script>
    (function() {
        var _pollingBackups = new Map();
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                document.querySelectorAll('[hx-trigger]').forEach(function(el) {
                    var trigger = el.getAttribute('hx-trigger');
                    if (trigger && trigger.indexOf('every') !== -1) {
                        _pollingBackups.set(el, trigger);
                        el.setAttribute('hx-trigger',
                            trigger.replace(/,?\s*every\s+[\d.]+[sm]?s?/g, ''));
                        htmx.process(el);
                    }
                });
            } else {
                _pollingBackups.forEach(function(trigger, el) {
                    el.setAttribute('hx-trigger', trigger);
                    htmx.process(el);
                    htmx.trigger(el, 'load');
                });
                _pollingBackups.clear();
            }
        });
    })();
    </script>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

</body>
</html>
