# SBK — configurazione gitleaks
# Usa il set di regole di default e allowlista solo i falsi positivi noti.
title = "SBK gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Falsi positivi noti nel template"
paths = [
  '''\.env\.example''',
  '''sbk\.config\.example\.json''',
  '''\.gitleaks\.toml''',
  # Librerie di terze parti vendorizzate e minificate: le proprietà key:"…" non sono segreti.
  '''lib/.*''',
]
