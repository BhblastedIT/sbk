# SBK — gitleaks configuration
# Uses the default rule set and allowlists only the known false positives.
title = "SBK gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known false positives in the templates"
paths = [
  '''\.env\.example''',
  '''sbk\.config\.example\.json''',
  '''\.gitleaks\.toml''',
  # Vendored, minified third-party libraries: their key:"…" properties are not secrets.
  '''lib/.*''',
]
