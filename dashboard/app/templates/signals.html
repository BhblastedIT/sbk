{% extends "base.html" %}

{% block title %}Signal Amplifier | SBK{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold">Signal Amplifier</h1>
        <p class="text-sm text-base-content/60 mt-1">
            Cross-source signals: themes emerging in 2+ independent sources
        </p>
    </div>

    <div class="flex gap-2 items-center">
        <button class="btn btn-sm btn-outline"
                hx-post="/api/signals/scan"
                hx-swap="none"
                hx-indicator="#scan-spinner"
                hx-on::after-request="htmx.trigger('#signals-table', 'refresh')">
            <span id="scan-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
            Scan Now
        </button>
    </div>
</div>

<!-- Filters -->
<div class="flex gap-3 items-center flex-wrap mb-4">
    <select id="signal-status-filter" class="select select-bordered select-sm"
            hx-get="/partials/signals_table"
            hx-target="#signals-table"
            hx-include="#signal-status-filter, #signal-days-filter"
            name="status">
        <option value="all">All</option>
        <option value="notified">Notified</option>
        <option value="dismissed">Dismissed</option>
        <option value="new">New</option>
    </select>

    <select id="signal-days-filter" class="select select-bordered select-sm"
            hx-get="/partials/signals_table"
            hx-target="#signals-table"
            hx-include="#signal-status-filter, #signal-days-filter"
            name="days_back">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
    </select>
</div>

<!-- Table -->
<div id="signals-table"
     hx-get="/partials/signals_table"
     hx-trigger="load, refresh"
     hx-swap="innerHTML">
    <div class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg"></span>
    </div>
</div>

{% endblock %}
