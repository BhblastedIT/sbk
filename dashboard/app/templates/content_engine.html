{% extends "base.html" %}
{% block title %}Content Engine — SBK{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Content Engine</h1>
        <div class="flex gap-2">
            <button class="btn btn-sm btn-primary"
                    hx-post="/api/content-engine/seeds/refresh"
                    hx-target="#ce-status"
                    hx-swap="innerHTML"
                    hx-indicator="#ce-spinner">
                Refresh Seeds
            </button>
            <button class="btn btn-sm btn-secondary"
                    hx-post="/api/content-engine/generate"
                    hx-target="#ce-status"
                    hx-swap="innerHTML"
                    hx-indicator="#ce-spinner">
                Generate Drafts
            </button>
            <span id="ce-spinner" class="loading loading-spinner loading-sm htmx-indicator"></span>
        </div>
    </div>

    <div id="ce-status" class="text-sm text-base-content/60"></div>

    <!-- Tabs -->
    <div role="tablist" class="tabs tabs-bordered">
        <a role="tab" class="tab tab-active" id="tab-seeds"
           onclick="switchTab('seeds')">Seeds</a>
        <a role="tab" class="tab" id="tab-queue"
           onclick="switchTab('queue')">Queue</a>
        <a role="tab" class="tab" id="tab-stats"
           onclick="switchTab('stats')">Stats</a>
    </div>

    <!-- Tab content -->
    <div id="panel-seeds"
         hx-get="/partials/content_engine_seeds"
         hx-trigger="load"
         hx-swap="innerHTML">
        <span class="loading loading-spinner loading-md"></span>
    </div>

    <div id="panel-queue" class="hidden"
         hx-get="/partials/content_engine_queue"
         hx-trigger="revealed"
         hx-swap="innerHTML">
    </div>

    <div id="panel-stats" class="hidden"
         hx-get="/partials/content_engine_stats"
         hx-trigger="revealed"
         hx-swap="innerHTML">
    </div>
</div>

<script>
function switchTab(tab) {
    ['seeds', 'queue', 'stats'].forEach(function(t) {
        document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-' + t).classList.toggle('tab-active', t === tab);
    });
    // Trigger HTMX load for lazy panels
    var panel = document.getElementById('panel-' + tab);
    if (panel && !panel.getAttribute('data-loaded')) {
        htmx.trigger(panel, 'revealed');
        panel.setAttribute('data-loaded', '1');
    }
}
</script>
{% endblock %}
