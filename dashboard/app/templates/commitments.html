{% extends "base.html" %}

{% block title %}Commitment Radar | SBK{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold">Commitment Radar</h1>
        <p class="text-sm text-base-content/60 mt-1">
            Tracking promises and commitments from email, meetings, Slack
        </p>
    </div>

    <div class="flex gap-2 items-center">
        <button class="btn btn-sm btn-outline"
                hx-post="/api/commitments/consolidate"
                hx-swap="none"
                hx-indicator="#consolidate-spinner"
                hx-on::after-request="htmx.trigger('#commitments-table', 'refresh')">
            <span id="consolidate-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
            Consolidate
        </button>
    </div>
</div>

<!-- Filters -->
<div class="flex gap-3 items-center flex-wrap mb-4">
    <select id="status-filter" class="select select-bordered select-sm"
            hx-get="/partials/commitments_table"
            hx-target="#commitments-table"
            hx-include="#status-filter, #person-filter"
            name="status">
        <option value="all">All</option>
        <option value="PENDING">Pending</option>
        <option value="KEPT">Kept</option>
        <option value="BROKEN">Broken</option>
        <option value="EXPIRED">Expired</option>
        <option value="DISMISSED">Dismissed</option>
    </select>

    <input type="text" id="person-filter" name="person" placeholder="Filter by person..."
           class="input input-bordered input-sm w-48"
           hx-get="/partials/commitments_table"
           hx-target="#commitments-table"
           hx-include="#status-filter, #person-filter"
           hx-trigger="keyup changed delay:300ms">
</div>

<!-- Table -->
<div id="commitments-table"
     hx-get="/partials/commitments_table"
     hx-trigger="load, refresh"
     hx-swap="innerHTML">
    <div class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg"></span>
    </div>
</div>

{% endblock %}
