{% extends "base.html" %}
{% block title %}Smart Reply — SBK{% endblock %}

{% block content %}
<div class="p-6 max-w-5xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Smart Reply</h1>
        <p class="text-base-content/60 text-sm mt-1">Generate email reply drafts in your style, with relational context</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Input Panel -->
        <div class="card bg-base-200">
            <div class="card-body">
                <h2 class="card-title text-lg">Email received</h2>

                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Sender email (optional)</span></label>
                    <input type="email" id="sender-email" placeholder="u1bd366@example.com"
                           class="input input-bordered input-sm">
                </div>

                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Sender name (optional)</span></label>
                    <input type="text" id="sender-name" placeholder="Mario Rossi"
                           class="input input-bordered input-sm">
                </div>

                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Email text</span></label>
                    <textarea id="email-text" rows="12" placeholder="Paste here the text of the email you want to reply to..."
                              class="textarea textarea-bordered text-sm leading-relaxed"></textarea>
                </div>

                <div class="flex gap-2">
                    <button id="generate-btn" class="btn btn-primary btn-sm" onclick="generateReply()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Generate Draft
                    </button>
                    <select id="language-select" class="select select-bordered select-sm">
                        <option value="auto">Language: Auto</option>
                        <option value="it">Italian</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="card bg-base-200">
            <div class="card-body">
                <div class="flex items-center justify-between">
                    <h2 class="card-title text-lg">Reply draft</h2>
                    <button id="copy-btn" class="btn btn-ghost btn-sm hidden" onclick="copyDraft()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        Copy
                    </button>
                </div>

                <!-- Loading -->
                <div id="reply-loading" class="hidden flex items-center gap-2 py-8 justify-center">
                    <span class="loading loading-spinner loading-md"></span>
                    <span class="text-sm text-base-content/60">Generating...</span>
                </div>

                <!-- Draft Output -->
                <div id="reply-output" class="hidden">
                    <div id="draft-text" class="bg-base-100 rounded-lg p-4 text-sm leading-relaxed whitespace-pre-wrap min-h-[200px]"></div>
                </div>

                <!-- Context Used -->
                <div id="context-panel" class="hidden mt-4">
                    <div class="collapse collapse-arrow bg-base-100 rounded-lg">
                        <input type="checkbox">
                        <div class="collapse-title text-sm font-medium">Context used</div>
                        <div class="collapse-content">
                            <div id="context-list" class="text-xs text-base-content/60 space-y-1"></div>
                        </div>
                    </div>
                </div>

                <!-- Sender Info -->
                <div id="sender-info" class="hidden mt-3">
                    <div class="flex items-center gap-2 text-xs text-base-content/50">
                        <span id="sender-badge"></span>
                    </div>
                </div>

                <!-- Error -->
                <div id="reply-error" class="hidden alert alert-error text-sm mt-2"></div>

                <!-- Empty State -->
                <div id="reply-empty" class="py-12 text-center text-base-content/40">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <p>Paste an email and click "Generate Draft"</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

async function generateReply() {
    const emailText = document.getElementById('email-text').value.trim();
    if (!emailText) { alert('Paste the email text'); return; }

    const senderEmail = document.getElementById('sender-email').value.trim();
    const senderName = document.getElementById('sender-name').value.trim();
    const language = document.getElementById('language-select').value;

    // Show loading
    document.getElementById('reply-empty').classList.add('hidden');
    document.getElementById('reply-output').classList.add('hidden');
    document.getElementById('context-panel').classList.add('hidden');
    document.getElementById('sender-info').classList.add('hidden');
    document.getElementById('reply-error').classList.add('hidden');
    document.getElementById('copy-btn').classList.add('hidden');
    document.getElementById('reply-loading').classList.remove('hidden');
    document.getElementById('generate-btn').disabled = true;

    try {
        const res = await fetch('/api/smart-reply', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-SBK-CSRF': '1'},
            body: JSON.stringify({
                email_text: emailText,
                sender_email: senderEmail,
                sender_name: senderName,
                language: language,
            })
        });
        const data = await res.json();

        document.getElementById('reply-loading').classList.add('hidden');

        if (data.error && !data.draft) {
            document.getElementById('reply-error').textContent = data.error;
            document.getElementById('reply-error').classList.remove('hidden');
            return;
        }

        // Show draft
        document.getElementById('draft-text').textContent = data.draft;
        document.getElementById('reply-output').classList.remove('hidden');
        document.getElementById('copy-btn').classList.remove('hidden');

        // Show context
        if (data.context_used && data.context_used.length > 0) {
            const contextList = document.getElementById('context-list');
            contextList.innerHTML = data.context_used.map(c => '<p>' + escapeHtml(c).replace(/\n/g, '<br>') + '</p>').join('');
            document.getElementById('context-panel').classList.remove('hidden');
        }

        // Show sender info
        if (data.sender_info) {
            const si = data.sender_info;
            let badge = si.found
                ? '<span class="badge badge-sm badge-success">Contact found</span> ' + escapeHtml(si.name)
                : '<span class="badge badge-sm badge-warning">Unknown contact</span>';
            if (si.tier) badge += ' <span class="badge badge-sm badge-ghost">' + escapeHtml(si.tier) + '</span>';
            if (si.organization) badge += ' <span class="badge badge-sm badge-ghost">' + escapeHtml(si.organization) + '</span>';
            document.getElementById('sender-badge').innerHTML = badge;
            document.getElementById('sender-info').classList.remove('hidden');
        }
    } catch (err) {
        document.getElementById('reply-loading').classList.add('hidden');
        document.getElementById('reply-error').textContent = 'Error: ' + err.message;
        document.getElementById('reply-error').classList.remove('hidden');
    } finally {
        document.getElementById('generate-btn').disabled = false;
    }
}

function copyDraft() {
    const text = document.getElementById('draft-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Copiato!';
        setTimeout(() => {
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> Copy';
        }, 2000);
    });
}
</script>
{% endblock %}
