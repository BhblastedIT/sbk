[project]
name = "sbk"
version = "0.1.0"
license = { text = "MIT" }
description = "Personal knowledge graph and data pipeline"
authors = [{ name = "salvatoresng" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "rapidfuzz>=3.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "aiohttp>=3.9",
    "keyring>=25.0",
    "pydantic>=2.0",
    # pydantic-settings removed — never imported (DEP-06)
    "python-dotenv>=1.0",
    "anthropic>=0.79.0",
    "lancedb>=0.29.2",
    "sentence-transformers>=5.2.2",
    "networkx>=3.6.1",
    "python-igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "numpy>=2.4.2",
    "jellyfish>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "duckdb>=1.0",
    "schedule>=1.2",
    "slack-sdk>=3.30",
    # hdbscan removed — transitive via bertopic (DEP-06)
    "bertopic>=0.17",
    # numba/llvmlite removed — transitive via hdbscan (DEP-06)
    "gliner>=0.2.25",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    # pytz removed — never imported, use zoneinfo (DEP-06)
    "mlx>=0.24",
    "mlx-embeddings>=0.0.5",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "dnspython>=2.8.0",
    "openai>=2.21.0",
    # reportlab is optional, only for tools/util/gen-dossier-pdf.py: `uv add reportlab`
    "splink>=5.0.0.dev2",
    "statsmodels>=0.14.6",
    "ruptures>=1.1.11rc1",
    "nh3>=0.3.4",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "pycookiecheat>=0.8.0",
    "segno>=1.6.6",
    "vtracer==0.6.15",
    "ezdxf>=1.4.4",
    "simpy>=4.1.2",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pre-commit>=4.0",
    "ipython>=8.0",
]
# Note: pytest is in [dependency-groups] dev, not here (DEP-07)

[project.scripts]
sbk = "tools.sbk_cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E722",   # bare except — legacy scripts, fix gradually
    "SIM103", # return condition directly — readability preference
    "SIM105", # contextlib.suppress — readability preference
    "SIM108", # ternary — readability preference
    "SIM110", # any() instead of loop — readability preference
    "SIM102", # nested if → combined — readability preference
    "SIM118", # key in dict vs dict.keys() — minor
    "B007",   # unused loop variable — legacy scripts
    "B023",   # closure loop variable — false positives in callback factories
    "B905",   # zip strict — not always needed
    "C401",   # unnecessary generator → set comprehension — minor
    "C402",   # unnecessary generator → dict comprehension — minor
    "C416",   # unnecessary dict comprehension — minor
    "F841",   # unused variable — legacy scripts, fix gradually
]

[tool.ruff.lint.per-file-ignores]
"tools/**/*.py" = ["E402"]                         # sys.path manipulation before sbk_config imports
"tools/sbk_config.py" = ["UP017", "UP038"]           # UTC bridge for the system Python 3.9: do not modernise
# sb-doc-check runs from pre-commit with the SYSTEM python3 (3.9), not `uv run`.
# `isinstance(x, A | B)` is 3.10+ syntax and would crash there; keep 3.9-compatible.
"tools/util/sb-doc-check.py" = ["UP038"]
"tools/email/em-l1-enrich.py" = ["E741"]           # ambiguous var name in legacy lambda
"tools/linkedin/li-util-adapter.py" = ["B904"]    # raise from in legacy exception handling
"tools/voice-memos/vm-util-transcribe-audio.py" = ["F401"]  # sklearn import for availability check
"tools/voice-memos/vm-l1-enrich.py" = ["UP038"]   # isinstance(x, (int, float)) pattern
# Some scripts run under the SYSTEM python (3.9), not 3.12. Prevent ruff from modernizing
# to 3.10+/3.11+ syntax (UP017 datetime.UTC, UP038/UP045 X | Y / X | None) that would crash
# at runtime on 3.9. Keep explicit Optional[...] annotations in those modules.
"dashboard/**/*.py" = ["E402"]              # sys.path manipulation before imports

[tool.ruff.lint.isort]
known-first-party = ["sbk_config"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
